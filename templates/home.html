<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ML Inference Dashboard</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);

            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        select,
        input {
            background-color: rgba(15, 23, 42, 0.8) !important;
            color: #94a3b8 !important;
        }

    </style>
</head>

<body class="flex items-center justify-center p-6">

    <div class="glass-panel rounded-2xl p-8 w-full max-w-5xl grid grid-cols-1 md:grid-cols-2 gap-12">

        <!-- LEFT PANEL -->

        <div>

            <h2 class="text-3xl font-bold mb-2 tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400">
                Inference Engine
            </h2>

            <p class="text-sm text-slate-400 mb-8">
                Enter student details to predict math score.
            </p>

            <form action="{{ url_for('predict_datapoint') }}"
                  method="post"
                  class="space-y-5">

                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">
                        Gender
                    </label>

                    <select name="gender" required
                            class="w-full rounded-lg border border-slate-600 p-2.5">

                        <option value="" disabled selected>Select Gender</option>

                        <option value="male">Male</option>

                        <option value="female">Female</option>

                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">
                        Race/Ethnicity
                    </label>

                    <select name="ethnicity" required
                            class="w-full rounded-lg border border-slate-600 p-2.5">

                        <option value="" disabled selected>Select Group</option>

                        <option value="group A">Group A</option>
                        <option value="group B">Group B</option>
                        <option value="group C">Group C</option>
                        <option value="group D">Group D</option>
                        <option value="group E">Group E</option>

                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">
                        Parental Education
                    </label>

                    <select name="parental_level_of_education"
                            required
                            class="w-full rounded-lg border border-slate-600 p-2.5">

                        <option value="" disabled selected>
                            Select Education
                        </option>

                        <option value="some high school">
                            Some High School
                        </option>

                        <option value="high school">
                            High School
                        </option>

                        <option value="some college">
                            Some College
                        </option>

                        <option value="associate's degree">
                            Associate's Degree
                        </option>

                        <option value="bachelor's degree">
                            Bachelor's Degree
                        </option>

                        <option value="master's degree">
                            Master's Degree
                        </option>

                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">
                        Lunch Type
                    </label>

                    <select name="lunch"
                            required
                            class="w-full rounded-lg border border-slate-600 p-2.5">

                        <option value="" disabled selected>
                            Select Lunch
                        </option>

                        <option value="standard">Standard</option>

                        <option value="free/reduced">
                            Free/Reduced
                        </option>

                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">
                        Test Preparation
                    </label>

                    <select name="test_preparation_course"
                            required
                            class="w-full rounded-lg border border-slate-600 p-2.5">

                        <option value="" disabled selected>
                            Select Status
                        </option>

                        <option value="none">None</option>

                        <option value="completed">Completed</option>

                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">
                        Reading Score
                    </label>

                    <input type="number"
                           name="reading_score"
                           placeholder="Enter Reading Score"
                           required
                           class="w-full rounded-lg border border-slate-600 p-2.5">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">
                        Writing Score
                    </label>

                    <input type="number"
                           name="writing_score"
                           placeholder="Enter Writing Score"
                           required
                           class="w-full rounded-lg border border-slate-600 p-2.5">
                </div>

                <button type="submit"
                        class="w-full mt-4 bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-500 hover:to-blue-400 text-white font-semibold py-3 rounded-lg shadow-lg">

                    Run Prediction Pipeline

                </button>

            </form>

        </div>

        <!-- RIGHT PANEL -->

        <div class="flex flex-col justify-center border-t md:border-t-0 md:border-l border-slate-700 pt-8 md:pt-0 md:pl-12">

            {% if results %}

            <div class="animate-pulse mb-2 text-emerald-400 text-sm font-semibold tracking-wider uppercase">
                Pipeline Execution Success
            </div>

            <div class="bg-slate-800/50 rounded-xl p-6 border border-slate-700 shadow-inner">

                <p class="text-slate-400 text-sm font-medium mb-1">
                    Predicted Math Score
                </p>

                <div class="text-5xl font-black text-white">
                    {{ results }}
                </div>

            </div>

            {% elif error_message %}

            <div class="bg-red-950/40 rounded-xl p-6 border border-red-800">

                <p class="text-red-300 font-semibold">
                    {{ error_message }}
                </p>

            </div>

            {% else %}

            <div class="text-center text-slate-500 flex flex-col items-center">

                <p class="text-lg">
                    Awaiting Input Data
                </p>

            </div>

            {% endif %}

        </div>

    </div>

</body>
</html>
